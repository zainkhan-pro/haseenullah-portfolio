name: Repair certificate viewer and nav

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair certificate viewer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()

          marker = '<style id="portfolio-certificate-viewer-v1">'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('certificate viewer style marker not found')

          # The viewer CSS must be outside the injected JavaScript.
          before = s[:pos]
          if not before.rstrip().endswith('</script>'):
              before = before.rstrip() + '\n</script>\n'
          else:
              before = before.rstrip() + '\n'
          s = before + s[pos:]

          # Convert literal backslash-n text inside the viewer CSS to real newlines.
          pos = s.find(marker)
          end = s.find('</style>', pos)
          if pos < 0 or end < 0:
              raise SystemExit('certificate viewer style block is incomplete')
          css_block = s[pos:end + len('</style>')]
          css_block = css_block.replace('\\n', '\n')
          s = s[:pos] + css_block + s[end + len('</style>'):]

          # The main Certification button should open the first real certificate scan,
          # not the NEBOSH logo. Certificate cards keep using their own image.
          old = "var img=(card&&card.querySelector('img')) || (qualification&&qualification.querySelector('img')) || (section&&section.querySelector('img'));"
          new = "var img=(card&&card.querySelector('img')) || (btn.closest('#certification') ? (section&&section.querySelector('img')) : null) || (qualification&&qualification.querySelector('img')) || (section&&section.querySelector('img'));"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          print('certificate viewer repair applied')
          PY

      - name: Commit repair safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: restore certificate viewer"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
