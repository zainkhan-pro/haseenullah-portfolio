name: Repair certificate viewer and nav

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair certificate viewer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()

          # Make sure the viewer style block is outside the injected script.
          marker = '<style id="portfolio-certificate-viewer-v1">'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('certificate viewer style marker not found')
          before = s[:pos]
          if before.rstrip().endswith('</script>') is False:
              before = before.rstrip() + '\n</script>\n'
          else:
              before = before.rstrip() + '\n'
          style_and_after = s[pos:]
          s = before + style_and_after

          # Turn accidental literal backslash-n text in the CSS into real newlines.
          pos = s.find(marker)
          end = s.find('</style>', pos)
          if pos < 0 or end < 0:
              raise SystemExit('certificate viewer style block is incomplete')
          css_block = s[pos:end + len('</style>')]
          css_block = css_block.replace('\\n', '\n')
          s = s[:pos] + css_block + s[end + len('</style>'):]

          # The main Certification button has no image inside its own card;
          # prefer the certificate scan button image before the NEBOSH logo.
          old = "var img=(card&&card.querySelector('img')) || (qualification&&qualification.querySelector('img')) || (section&&section.querySelector('img'));"
          new = "var img=(card&&card.querySelector('img')) || (btn.closest('#certification') && section && section.querySelector('button img')) || (qualification&&qualification.querySelector('img')) || (section&&section.querySelector('img'));"
          s = s.replace(old, new, 1)

          p.write_text(s)
          print('viewer repair applied')
          PY

      - name: Commit repair safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: restore certificate viewer and nav interactions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
