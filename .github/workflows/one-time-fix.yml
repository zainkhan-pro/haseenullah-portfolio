name: One-time targeted runtime fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch server only
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text(encoding='utf-8')

          old = 'if (url.pathname === "/" || url.pathname === "/index.html") {'
          new = '''if (url.pathname === "/favicon.ico") return new Response('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0f172a"/><path d="M18 16h8v13h12V16h8v32h-8V37H26v11h-8z" fill="#f59e0b"/></svg>',{headers:{"content-type":"image/svg+xml","cache-control":"public, max-age=31536000, immutable"}}); if (url.pathname === "/" || url.pathname === "/index.html") {'''
          if old not in s:
              raise SystemExit('route anchor not found')
          s = s.replace(old, new, 1)

          old = 'const html = injectHomepageSeo(siteHtml.default.replace("<head>", `<head>${favicon}`)); return new Response(html,{headers:{"content-type":"text/html; charset=utf-8","cache-control":"no-store, max-age=0"}});'
          new = '''let html = injectHomepageSeo(siteHtml.default.replace("<head>", `<head>${favicon}`)); html = html.replace(/<link rel="modulepreload" href="\\/assets\\/index-BXkrt9om\\.js"\\s*\\/>/g, "").replace(/<link rel="modulepreload" href="\\/assets\\/routes-bQ36gYTy\\.js"\\s*\\/>/g, "").replace(/<script class="\\$tsr" id="\\$tsr-stream-barrier">[\\s\\S]*?<\\/script>/g, "").replace(/<script type="module" async="" src="\\/assets\\/index-BXkrt9om\\.js"><\\/script>/g, ""); return new Response(html,{headers:{"content-type":"text/html; charset=utf-8","cache-control":"no-store, max-age=0"}});'''
          if old not in s:
              raise SystemExit('homepage anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-fix.yml
          git add src/server.ts
          git commit -m "fix: remove homepage hydration mismatch and favicon 404"
          git push
