name: Restore mobile dropdown and improve performance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted server-only fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text(encoding='utf-8')

          anchor = '''</style>\n<script>\n(function(){var ids=['profile','certification','certificates','competencies','fieldkit','education'],started=false;'''
          replacement = '''</style>\n<script>\n(function(){\n  function setupMobileMenu(){\n    var nav=document.querySelector('header nav');\n    if(!nav || nav.dataset.menuReady==='1') return;\n    var btn=nav.querySelector('button[aria-label="Toggle menu"]');\n    if(!btn) return;\n    nav.dataset.menuReady='1';\n    var panel=document.createElement('div');\n    panel.id='mobile-menu-panel';\n    panel.setAttribute('aria-hidden','true');\n    panel.innerHTML='<div class="mobile-menu-inner">'+\n      '<a href="#profile">Profile</a>'+\n      '<a href="#certification">Certification</a>'+\n      '<a href="#certificates">Certificates</a>'+\n      '<a href="#competencies">Competencies</a>'+\n      '<a href="#fieldkit">Field Kit</a>'+\n      '<a href="#education">Education</a>'+\n      '<a href="#contact" class="mobile-menu-hire">Hire Me <span>↗</span></a>'+\n      '</div>';\n    document.body.appendChild(panel);\n    function close(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');btn.setAttribute('aria-expanded','false');}\n    function toggle(){var open=!panel.classList.contains('open');panel.classList.toggle('open',open);panel.setAttribute('aria-hidden',String(!open));btn.setAttribute('aria-expanded',String(open));}\n    btn.setAttribute('aria-expanded','false');\n    btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggle();});\n    panel.addEventListener('click',function(e){var a=e.target.closest('a');if(a)close();});\n    document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});\n    window.addEventListener('resize',function(){if(window.innerWidth>=1024)close();},{passive:true});\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupMobileMenu);else setupMobileMenu();\n  window.addEventListener('load',setupMobileMenu);\n})();\n(function(){var ids=['profile','certification','certificates','competencies','fieldkit','education'],started=false;'''
          if anchor not in s:
              raise SystemExit('script anchor not found')
          s=s.replace(anchor,replacement,1)

          css_anchor = '''body>div.fixed.inset-0 img,body>div[class*='fixed'][class*='inset-0'] img{max-width:min(100%,1100px)!important;max-height:calc(100vh - 110px)!important;width:auto!important;height:auto!important;object-fit:contain!important;margin:auto!important}\n'''
          css_add = '''body>div.fixed.inset-0 img,body>div[class*='fixed'][class*='inset-0'] img{max-width:min(100%,1100px)!important;max-height:calc(100vh - 110px)!important;width:auto!important;height:auto!important;object-fit:contain!important;margin:auto!important}\n#mobile-menu-panel{display:none!important}\n@media(max-width:1023px){#mobile-menu-panel{display:block!important;position:fixed!important;left:0!important;right:0!important;top:68px!important;z-index:49!important;background:rgba(15,23,42,.97)!important;border-top:1px solid rgba(255,255,255,.1)!important;border-bottom:1px solid rgba(255,255,255,.12)!important;box-shadow:0 18px 35px rgba(0,0,0,.35)!important;transform:translateY(-8px)!important;opacity:0!important;pointer-events:none!important;transition:opacity .18s ease,transform .18s ease!important;backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important}#mobile-menu-panel.open{opacity:1!important;transform:translateY(0)!important;pointer-events:auto!important}.mobile-menu-inner{display:flex!important;flex-direction:column!important;padding:10px 16px 16px!important;gap:2px!important}.mobile-menu-inner a{display:flex!important;align-items:center!important;justify-content:space-between!important;padding:13px 10px!important;color:#e5e7eb!important;font-family:monospace!important;font-size:12px!important;text-transform:uppercase!important;letter-spacing:.12em!important;border-bottom:1px solid rgba(255,255,255,.06)!important}.mobile-menu-inner a:active,.mobile-menu-inner a:hover{color:#facc15!important}.mobile-menu-inner .mobile-menu-hire{margin-top:8px!important;background:#facc15!important;color:#111827!important;border:0!important;justify-content:center!important;font-weight:700!important}.mobile-menu-inner .mobile-menu-hire:hover{color:#111827!important;background:#fef3c7!important}}\n@media(min-width:1024px){#mobile-menu-panel{display:none!important}}\n/* Keep costly animated effects from running while they are off-screen. */\n.animate-marquee,.animate-float-y{will-change:transform;backface-visibility:hidden;transform:translateZ(0)}\nsection:not(#top){content-visibility:auto;contain-intrinsic-size:900px}\n'''
          if css_anchor not in s:
              raise SystemExit('css anchor not found')
          s=s.replace(css_anchor,css_add,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/menu-performance-fix.yml
          git add src/server.ts
          git commit -m "fix: restore mobile dropdown and improve homepage performance"
          git push
