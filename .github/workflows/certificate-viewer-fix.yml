name: Restore certificate viewer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch certificate viewer only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text(encoding='utf-8')
          marker = '</script>`;\n  const seo'
          if 'portfolio-certificate-viewer-v1' in s:
              print('Certificate viewer already present; nothing to do.')
              raise SystemExit(0)
          patch = r'''\n(function(){\n  function setupCertificateViewer(){\n    if(document.documentElement.dataset.certViewerReady==='1') return;\n    var section=document.getElementById('certificates');\n    var qualification=document.getElementById('certification');\n    if(!section && !qualification) return;\n    document.documentElement.dataset.certViewerReady='1';\n    var modal=document.createElement('div');\n    modal.id='portfolio-certificate-viewer-v1';\n    modal.setAttribute('aria-hidden','true');\n    modal.innerHTML='<div class="pcv-backdrop"></div>'+\n      '<div class="pcv-dialog" role="dialog" aria-modal="true" aria-label="Certificate viewer">'+\n      '<button type="button" class="pcv-close" aria-label="Close certificate viewer">×</button>'+\n      '<div class="pcv-title">Certificate Preview</div>'+\n      '<div class="pcv-frame"><img class="pcv-image" alt="Certificate preview"></div>'+\n      '</div>';\n    document.body.appendChild(modal);\n    var image=modal.querySelector('.pcv-image');\n    var closeBtn=modal.querySelector('.pcv-close');\n    function close(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.removeProperty('overflow');}\n    function open(src,alt){if(!src)return;image.src=src;image.alt=alt||'Certificate preview';modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}\n    closeBtn.addEventListener('click',close);\n    modal.querySelector('.pcv-backdrop').addEventListener('click',close);\n    document.addEventListener('keydown',function(e){if(e.key==='Escape' && modal.classList.contains('open')) close();});\n    function bind(root){\n      if(!root)return;\n      root.addEventListener('click',function(e){\n        var btn=e.target.closest('button');\n        if(!btn)return;\n        var img=btn.querySelector('img');\n        var isCertCard=btn.closest('#certificates') && img;\n        var isMainCert=btn.closest('#certification') && /View Certificate/i.test(btn.textContent||'');\n        if(!isCertCard && !isMainCert)return;\n        e.preventDefault();\n        e.stopPropagation();\n        if(isCertCard) open(img.currentSrc||img.src,img.alt);\n        else {\n          var first=document.querySelector('#certificates button img');\n          if(first) open(first.currentSrc||first.src,first.alt);\n        }\n      },true);\n    }\n    bind(section);\n    bind(qualification);\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupCertificateViewer);else setupCertificateViewer();\n  window.addEventListener('load',setupCertificateViewer);\n})();\n'''
          css = r'''\n<style id="portfolio-certificate-viewer-v1">\n#portfolio-certificate-viewer-v1{position:fixed!important;inset:0!important;z-index:9999!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:24px!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important;transition:opacity .18s ease,visibility .18s ease!important}\n#portfolio-certificate-viewer-v1.open{opacity:1!important;visibility:visible!important;pointer-events:auto!important}\n#portfolio-certificate-viewer-v1 .pcv-backdrop{position:absolute!important;inset:0!important;background:rgba(0,0,0,.88)!important;backdrop-filter:blur(5px)!important;-webkit-backdrop-filter:blur(5px)!important}\n#portfolio-certificate-viewer-v1 .pcv-dialog{position:relative!important;z-index:1!important;width:min(1100px,96vw)!important;max-height:94vh!important;background:#171717!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:8px!important;box-shadow:0 30px 90px rgba(0,0,0,.65)!important;padding:18px!important;display:flex!important;flex-direction:column!important;gap:12px!important}\n#portfolio-certificate-viewer-v1 .pcv-title{font-family:monospace!important;text-transform:uppercase!important;letter-spacing:.2em!important;font-size:11px!important;color:#facc15!important;padding:2px 46px 4px 4px!important}\n#portfolio-certificate-viewer-v1 .pcv-close{position:absolute!important;right:12px!important;top:10px!important;width:38px!important;height:38px!important;border:1px solid rgba(255,255,255,.18)!important;border-radius:4px!important;background:#222!important;color:#fff!important;font-size:26px!important;line-height:1!important;cursor:pointer!important}\n#portfolio-certificate-viewer-v1 .pcv-close:hover{background:#facc15!important;color:#111!important}\n#portfolio-certificate-viewer-v1 .pcv-frame{min-height:0!important;overflow:auto!important;background:#fff!important;border-radius:4px!important;display:flex!important;align-items:center!important;justify-content:center!important}\n#portfolio-certificate-viewer-v1 .pcv-image{display:block!important;max-width:100%!important;max-height:calc(94vh - 105px)!important;width:auto!important;height:auto!important;object-fit:contain!important;margin:auto!important}\n@media(max-width:767px){#portfolio-certificate-viewer-v1{padding:10px!important}#portfolio-certificate-viewer-v1 .pcv-dialog{width:100%!important;max-height:96vh!important;padding:10px!important}#portfolio-certificate-viewer-v1 .pcv-image{max-height:calc(96vh - 85px)!important}}\n</style>\n'''
          replacement = patch + css + marker
          if marker not in s:
              raise SystemExit('Patch marker not found; refusing to modify server.ts')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          print('Certificate viewer patch applied.')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts .github/workflows/certificate-viewer-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore certificate viewer interaction"
          git rm .github/workflows/certificate-viewer-fix.yml
          git commit -m "chore: remove one-time certificate viewer workflow"
          git push
