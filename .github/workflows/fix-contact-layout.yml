name: Fix contact layout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch server
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  main section#contact {
    padding-top: 132px !important;
    padding-bottom: 72px !important;
  }
  main section#contact > div { transform: translateY(24px) !important; }
  main section#contact .grid { align-items: start !important; }'''
          new = '''  /* Desktop contact area: vertically center the three cards. */
  main section#contact,
  main > section:last-of-type {
    min-height: calc(100vh - 88px) !important;
    box-sizing: border-box !important;
    padding-top: 112px !important;
    padding-bottom: 96px !important;
    display: flex !important;
    align-items: center !important;
  }
  main section#contact > div,
  main > section:last-of-type > div {
    width: 100% !important;
    transform: none !important;
  }
  main section#contact .grid,
  main > section:last-of-type .grid {
    align-items: center !important;
  }
  main section#contact .grid > *,
  main > section:last-of-type .grid > * {
    align-self: center !important;
  }'''
          if old not in s:
              raise SystemExit('Expected contact CSS block was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('patched')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts
          git commit -m 'Fix desktop contact card vertical alignment' || exit 0
          git push